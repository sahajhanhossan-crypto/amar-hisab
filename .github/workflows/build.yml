name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev python3-pip cmake
          pip install --upgrade pip wheel setuptools
          pip install cython
      - name: Build APK using Buildozer
        uses: ArtemSBulgakov/buildozer-action@v3
        with:
          workdir: .
          buildozer_version: stable
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-App-APK
          path: bin/*.apk
